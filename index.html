
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>黑烟扩散效果</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent !important;
}

#smokeView {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;
}

#smokeCanvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

/* 左侧火焰按钮 */
#fireButton {
  position: absolute;
  top: 50%;
  left: 9%;
  transform: translate(-50%, -50%);

  width: 58px;
  height: 58px;

  border-radius: 50%;
  background: rgba(37, 21, 15, .8);
  border: 1px solid #ae552a;

  display: grid;
  place-items: center;

  cursor: pointer;
  z-index: 10;

  box-shadow: 0 0 14px rgba(214, 90, 48, .3);
}

#fireButton svg {
  width: 34px;
  height: 39px;
  animation: flameMove 1.2s ease-in-out infinite;
}

@keyframes flameMove {
  0%, 100% {
    transform: scale(1) rotate(-2deg);
  }
  50% {
    transform: scale(1.1) rotate(3deg);
  }
}

#fireButton:hover {
  box-shadow: 0 0 25px rgba(255, 100, 30, .65);
}
</style>
</head>

<body>

<div id="smokeView">

  <canvas id="smokeCanvas"></canvas>

  <button id="fireButton" aria-label="启动烟雾效果">

    <svg viewBox="0 0 64 76">

      <path
        d="M32 3C37 19 24 23 32 37c5-8 12-13 10-25
        17 16 21 30 14 46C50 71 38 75 30 74
        14 73 3 63 5 46 7 30 21 21 19 12
        c10 8 10 18 13 24C27 23 34 17 32 3z"
        fill="#ea5220"
      />

      <path
        d="M32 30c1 12-9 14-4 24
        3-6 9-8 9-16
        11 13 12 21 6 28
        -5 6-16 8-23 1
        -9-10-2-20 5-28
        -2 10 2 11 7 15
        -2-9 3-14 0-24z"
        fill="#ffb342"
      />

      <path
        d="M32 50c3 6-4 8 0 12
        2-2 4-5 5-8
        5 7 4 14-4 16
        -7 2-13-3-11-10
        1-4 5-8 6-11
        0 5 2 7 4 9z"
        fill="#fff4b6"
      />

    </svg>

  </button>

</div>

<script>
(function() {

  const root = document.getElementById("smokeView");
  const canvas = document.getElementById("smokeCanvas");
  const ctx = canvas.getContext("2d");
  const button = document.getElementById("fireButton");

  let W = 0;
  let H = 0;

  let particles = [];
  let startTime = -1;

  /* 调整画布尺寸 */
  function resize() {

    W = root.clientWidth;
    H = root.clientHeight;

    const dpr = Math.min(
      window.devicePixelRatio || 1,
      2
    );

    canvas.width = W * dpr;
    canvas.height = H * dpr;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  }

  resize();

  new ResizeObserver(resize).observe(root);

  /* 点击火焰按钮 */
  button.addEventListener("click", function() {

    startTime = performance.now();

    particles = [];

  });

  /* 绘制浓烟 */
  function animate(time) {

    ctx.clearRect(0, 0, W, H);

    if (startTime > 0) {

      const seconds = (time - startTime) / 1000;

      const progress = Math.min(
        1,
        seconds / 3.3
      );

      /* 烟雾向右推进 */
      const front = W * (
        0.12 +
        0.9 * (
          1 - Math.pow(1 - progress, 1.5)
        )
      );

      /* 右半侧逐渐形成浓烟遮挡 */
      if (seconds > 2.4) {

        const opacity = Math.min(
          0.8,
          (seconds - 2.4) * 0.4
        );

        const gradient = ctx.createLinearGradient(
          W * 0.4,
          0,
          W,
          0
        );

        gradient.addColorStop(
          0,
          "rgba(10,12,14,0)"
        );

        gradient.addColorStop(
          1,
          "rgba(8,10,12," + opacity + ")"
        );

        ctx.fillStyle = gradient;

        ctx.fillRect(
          W * 0.4,
          0,
          W * 0.6,
          H
        );

      }

      /* 持续生成大面积烟雾 */
      const amount = seconds < 4 ? 13 : 5;

      for (let i = 0; i < amount; i++) {

        particles.push({

          x:
            W * (0.15 + Math.random() * 0.04)
            + Math.random()
            * Math.max(0, front - W * 0.17),

          y:
            (Math.random() * 1.25 - 0.12) * H,

          r:
            H * (0.12 + Math.random() * 0.2),

          life: 0,

          ttl:
            140 + Math.random() * 210,

          vx:
            0.15 + Math.random() * 0.65,

          vy:
            (Math.random() - 0.5) * 0.4,

          grey:
            12 + Math.random() * 32,

          alpha:
            0.18 + Math.random() * 0.29

        });

      }

      /* 限制粒子数量 */
      if (particles.length > 490) {

        particles.splice(
          0,
          particles.length - 490
        );

      }

      /* 更新和绘制烟雾 */
      for (const p of particles) {

        p.life++;

        p.x += p.vx;

        p.y += p.vy +
          Math.sin(p.life * 0.025) * 0.2;

        const alpha = p.alpha
          * Math.min(1, p.life / 22)
          * Math.max(
              0,
              Math.min(
                1,
                (p.ttl - p.life) / 65
              )
            );

        const radius =
          p.r * (1 + p.life / 290);

        const gradient = ctx.createRadialGradient(
          p.x,
          p.y,
          0,
          p.x,
          p.y,
          radius
        );

        const grey = Math.round(p.grey);

        gradient.addColorStop(
          0,
          `rgba(${grey},${grey + 2},${grey + 3},${alpha})`
        );

        gradient.addColorStop(
          0.5,
          `rgba(${grey + 12},${grey + 13},${grey + 14},${alpha * 0.7})`
        );

        gradient.addColorStop(
          1,
          "rgba(45,45,47,0)"
        );

        ctx.fillStyle = gradient;

        ctx.beginPath();

        ctx.ellipse(
          p.x,
          p.y,
          radius * 1.2,
          radius,
          0,
          0,
          Math.PI * 2
        );

        ctx.fill();

      }

      /* 清除结束的烟雾粒子 */
      particles = particles.filter(
        p => p.life < p.ttl
      );

    }

    requestAnimationFrame(animate);

  }

  requestAnimationFrame(animate);

})();
</script>

</body>
</html>
